name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # vue-i18n's own parser, for the strictest check of admin-panel strings.
      - run: npm install --no-audit --no-fund
      # filex-app.json must be what translations/ says it is…
      - run: node scripts/pack.mjs build --check
      # …and every string must render the way filex will render it.
      - run: node scripts/validate.mjs filex-app.json
