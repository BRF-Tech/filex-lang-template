name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # vue-i18n's own parser, for the strictest check of admin-panel strings.
      - run: npm install --no-audit --no-fund
      # filex-app.json must be what translations/ says it is…
      - run: node scripts/pack.mjs build --check
      # …and every string must render the way filex will render it.
      - run: node scripts/validate.mjs filex-app.json
